name: Update v1 tag

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable release tag to promote, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-v1-tag
  cancel-in-progress: false

jobs:
  update-major-tag:
    name: Move v1 to a stable release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release and update v1
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-tag must be a stable v1 semantic version such as v1.2.3" >&2
            exit 1
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r .draft <<<"$release")" != "false" || "$(jq -r .prerelease <<<"$release")" != "false" ]]; then
            echo "release-tag must identify a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          target_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git tag --force v1 "$target_commit"
          git push --force origin refs/tags/v1
